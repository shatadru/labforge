{{- if .Values.auth.enabled }}
# Only oauth2-proxy may reach the control plane directly. Everything else
# (including the Tailscale ingress) goes through the auth proxy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "labforge.fullname" . }}
  labels:
    {{- include "labforge.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "labforge.labels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: oauth2-proxy
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - protocol: TCP
          port: 8000
{{- end }}
