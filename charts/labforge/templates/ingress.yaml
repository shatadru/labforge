{{- if .Values.ingress.enabled }}
{{- $host := required "global.labforge.ingressHost is required when ingress.enabled" .Values.global.labforge.ingressHost }}
{{- $backend := include "labforge.fullname" . }}
{{- $port := .Values.service.port }}
{{- if .Values.auth.enabled }}
{{- $backend = include "labforge.auth.fullname" . }}
{{- $port = 80 }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "labforge.fullname" . }}
  labels:
    {{- include "labforge.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $backend }}
                port:
                  number: {{ $port }}
  {{- if .Values.ingress.tls }}
  tls:
    - hosts:
        - {{ $host | quote }}
  {{- end }}
{{- end }}
