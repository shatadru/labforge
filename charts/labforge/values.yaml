# LabForge Helm values.
# Every option has a working default for a single node libvirt host.

image:
  repository: ghcr.io/OWNER/labforge
  tag: "0.1.0"
  pullPolicy: IfNotPresent

# LabForge talks to libvirt on the host. Keep one replica and share the host
# network so the in pod WebSocket bridge can reach QEMU graphics on 127.0.0.1.
replicaCount: 1
hostNetwork: true

# Pin to the KVM host, for example:
#   nodeSelector:
#     kubernetes.io/hostname: kvm-host
nodeSelector: {}
tolerations: []
affinity: {}

service:
  type: ClusterIP
  port: 80

# Application configuration (non secret). These become ConfigMap entries.
config:
  virshUri: qemu:///system
  vmNamePrefix: labs-
  defaultMemoryMb: 1536
  defaultVcpus: 2
  defaultDiskGb: 30
  resourceBudgetPercent: 50
  graphicsType: vnc
  logLevel: info

# Host paths that must already exist on the libvirt host.
storage:
  libvirtSocketPath: /var/run/libvirt
  libvirtImagesPath: /var/lib/libvirt/images
  # Writable directory for VM disks and seed ISOs.
  vmStoragePath: /var/lib/libvirt/images/labforge

# Directory of prepared cloud images and template.json files.
templates:
  hostPath: /var/lib/libvirt/labforge/templates

# Secret holding the public keys injected into guests.
#   kubectl create secret generic labforge-ssh-keys \
#     --from-file=authorized_keys=$HOME/.ssh/id_ed25519.pub
sshKeys:
  secretName: labforge-ssh-keys
  key: authorized_keys

# Optional Secret holding the Tailscale auth key file. It is mounted read only
# and only ever copied onto the VM seed. Leave secretName empty to disable.
tailscale:
  secretName: ""
  key: auth-key

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi

serviceAccount:
  create: true
  name: ""
