# LabForge Helm values -- control plane only.
#
# The chart deploys MODE=control with HOST_MODE=remote. Libvirt stays on the
# KVM host behind the labforge-agent package (.deb / .rpm). Point agent.url at
# that agent and mount the shared token from a Secret.
#
# By default this chart also bundles the login stack (Pocket ID + oauth2-proxy)
# and a single-room chat (ntfy). Turn them off with auth.enabled=false and
# chat.enabled=false for a control-plane-only install.

image:
  repository: ghcr.io/OWNER/labforge
  # Empty means "use the chart appVersion", which the release workflow sets.
  tag: ""
  pullPolicy: IfNotPresent

replicaCount: 1

# Control plane never shares the host network; consoles reach QEMU through the
# agent WebSocket proxy on the KVM host.
hostNetwork: false

nodeSelector: {}
tolerations: []
affinity: {}

service:
  type: ClusterIP
  port: 80

# Application configuration (non secret). These become ConfigMap entries.
config:
  hostMode: remote
  mode: control
  vmNamePrefix: labs-
  defaultMemoryMb: 1536
  defaultVcpus: 2
  defaultDiskGb: 30
  resourceBudgetPercent: 50
  graphicsType: vnc
  logLevel: info

# Reach the labforge-agent on the KVM host.
#   kubectl create secret generic labforge-agent-token \
#     --from-literal=token="$(openssl rand -hex 32)"
agent:
  url: http://127.0.0.1:8443
  tokenSecretName: labforge-agent-token
  tokenKey: token

# Guest SSH public keys injected into new VMs.
#   kubectl create secret generic labforge-ssh-keys \
#     --from-file=authorized_keys=$HOME/.ssh/id_ed25519.pub
sshKeys:
  secretName: labforge-ssh-keys
  key: authorized_keys

# Optional Secret holding the Tailscale auth key file for guest VMs.
tailscale:
  secretName: ""
  key: auth-key

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi

serviceAccount:
  create: true
  name: ""

# Values shared with the bundled subcharts. oauth2-proxy reads these through
# .Values.global in its tpl-rendered extraEnv.
global:
  labforge:
    # FQDN browsers use for the control plane, e.g. labforge.example.com.
    # Drives the OAuth callback and oauth2-proxy whitelist.
    ingressHost: ""
    # Pocket ID OIDC issuer URL (auth.provider=pocket-id only).
    issuer: ""
    # Optional second hostname for Pocket ID served by a LAN Ingress.
    lanHost: ""
    # GitHub access control (auth.provider=github). Read by oauth2-proxy through
    # tpl-rendered extraEnv, so it must live under global.
    github:
      # Restrict to members of this GitHub org and/or team. Set at least one,
      # or set allowAll for an intentionally open (dev) setup.
      org: ""
      # team is "org:team" (needs the read:org scope).
      team: ""
      # DANGER: when org/team are empty this lets ANY GitHub user in.
      allowAll: false

# ---------------------------------------------------------------------------
# Browser access (Tailscale Ingress by default).
# ---------------------------------------------------------------------------
ingress:
  enabled: false
  className: tailscale
  # Set host via global.labforge.ingressHost.
  tls: true

# ---------------------------------------------------------------------------
# Login gate (oauth2-proxy) in front of LabForge.
#
#   provider: github     GitHub OAuth (default; no extra in-cluster dependency)
#   provider: pocket-id  bundled Pocket ID OIDC (offline/self-contained)
#
# GitHub: create a GitHub OAuth App and a Secret with keys
#   client-id / client-secret / cookie-secret
#   (cookie-secret must be 16/24/32 bytes, e.g. `openssl rand -hex 16`).
#   auth.github.existingSecret names it (default labforge-github-oauth); keep
#   oauth2-proxy.config.existingSecret in sync if you rename it.
#
# Pocket ID (offline): apply -f values-pocket-id.yaml and set
#   auth.provider=pocket-id, auth.pocketId.enabled=true. The Secret needs
#   ENCRYPTION_KEY, STATIC_API_KEY, cookie-secret; the bootstrap job adds
#   client-id/client-secret.
# ---------------------------------------------------------------------------
auth:
  enabled: false
  provider: github
  # -- GitHub (provider: github) --
  github:
    # Secret with client-id, client-secret, cookie-secret.
    existingSecret: labforge-github-oauth
  # -- Pocket ID (provider: pocket-id) --
  # Secret with ENCRYPTION_KEY, STATIC_API_KEY, cookie-secret.
  existingSecret: labforge-auth
  # Optional LAN alias for Pocket ID via a Traefik Ingress (global.labforge.lanHost).
  lanClassName: traefik
  lanClusterIssuer: ""
  # Create the LabForge OIDC client in Pocket ID and store its credentials.
  bootstrap:
    enabled: true
    image: alpine:3.20
    backoffLimit: 6
  # Gate the bundled pocket-id subchart (provider: pocket-id).
  pocketId:
    enabled: false

# ---------------------------------------------------------------------------
# Chat: one persistent room backed by ntfy (ClusterIP only, no ingress).
# ---------------------------------------------------------------------------
chat:
  enabled: false
  topic: labforge
  storageClass: ""
  storageSize: 1Gi

# ---------------------------------------------------------------------------
# Subchart: oauth2-proxy (login gate + reverse proxy for LabForge).
#
# Default provider is GitHub. The provider block uses ${ENV} placeholders that
# oauth2-proxy expands; the values are supplied by the tpl-rendered extraEnv
# below (which reads global.labforge.*). The pocket-id overlay replaces both
# alphaConfig.configData.providers and extraEnv.
# ---------------------------------------------------------------------------
oauth2-proxy:
  replicaCount: 1
  # Secret with client-id, client-secret, cookie-secret.
  config:
    existingSecret: labforge-github-oauth
  # Apply oauth2-proxy after the Pocket ID bootstrap hook (sync-wave 1).
  deploymentAnnotations:
    "argocd.argoproj.io/sync-wave": "2"
  alphaConfig:
    enabled: true
    configData:
      providers:
        - id: github
          provider: github
          name: GitHub
          clientID: ${OAUTH2_PROXY_CLIENT_ID}
          clientSecret: ${OAUTH2_PROXY_CLIENT_SECRET}
          githubConfig:
            org: ${GITHUB_ORG}
            team: ${GITHUB_TEAM}
      upstreamConfig:
        upstreams:
          - id: labforge
            path: /
            uri: ${LABFORGE_UPSTREAM}
            flushInterval: 1s
            passHostHeader: true
            proxyWebSockets: true
      injectRequestHeaders:
        - name: X-Forwarded-User
          values:
            - claimSource:
                claim: user
        - name: X-Forwarded-Email
          values:
            - claimSource:
                claim: email
        - name: X-Auth-Request-User
          values:
            - claimSource:
                claim: user
  # tpl-rendered by the subchart with the subchart context (globals included).
  # client-id / client-secret / cookie-secret come from config.existingSecret.
  extraEnv:
    - name: GITHUB_ORG
      value: "{{ .Values.global.labforge.github.org }}"
    - name: GITHUB_TEAM
      value: "{{ .Values.global.labforge.github.team }}"
    - name: LABFORGE_UPSTREAM
      value: "http://{{ .Release.Name }}-labforge:80"
    - name: OAUTH2_PROXY_REDIRECT_URL
      value: "https://{{ .Values.global.labforge.ingressHost }}/oauth2/callback"
    - name: OAUTH2_PROXY_COOKIE_SECURE
      value: "true"
    - name: OAUTH2_PROXY_REVERSE_PROXY
      value: "true"
    - name: OAUTH2_PROXY_WHITELIST_DOMAINS
      value: "{{ .Values.global.labforge.ingressHost }}"

# ---------------------------------------------------------------------------
# Subchart: pocket-id (OIDC provider). Uses the pre-created Secret above.
# ---------------------------------------------------------------------------
pocket-id:
  # APP_URL host (no scheme). Must match global.labforge.issuer without scheme.
  host: ""
  timeZone: Etc/UTC
  analyticsDisabled: true
  # Use the operator pre-created Secret (<release>.auth.existingSecret) instead
  # of letting the chart generate one, so keys survive installs and Argo syncs.
  secret:
    create: false
    name: labforge-auth
  persistence:
    data:
      enabled: true
      storageClass: ""
      size: 1Gi
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: "500m"
      memory: 256Mi

# ---------------------------------------------------------------------------
# Subchart: ntfy (chat message store). No ingress; LabForge talks to it
# in-cluster only.
# ---------------------------------------------------------------------------
ntfy:
  ntfy:
    baseURL: https://labforge.invalid
    cache:
      file: /data/cache.db
      duration: 720h
    auth:
      file: /data/auth.db
      defaultAccess: read-write
    webRoot: disable
  persistence:
    enabled: true
    storageClass: ""
    size: 1Gi
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: "200m"
      memory: 128Mi
