[tox]
envlist = py
skipsdist = true
isolated_build = false

[testenv]
description = Run the LabForge test suite with coverage
deps =
    -r requirements.txt
    -r requirements-dev.txt
commands =
    pytest --cov=app --cov-report=term-missing {posargs}
setenv =
    TEMPLATES_DIR = {toxinidir}/cloud_init_templates
    VM_STORAGE_PATH = {envtmpdir}
passenv =
    HOME
