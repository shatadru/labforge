{% if vms %}
  {% for vm in vms %}
    {% set usage = usage_by_name.get(vm.name) if usage_by_name is defined else none %}
    {% include "partials/vm_card.html" %}
  {% endfor %}
{% else %}
  <div class="empty-state">
    <div class="empty-icon" aria-hidden="true">🖥️</div>
    <p class="empty-title">No lab VMs yet.</p>
    <p class="empty-hint">Provision your first VM from a cloud image template.</p>
    <a href="/templates" class="btn btn-primary">+ Provision a VM</a>
  </div>
{% endif %}
