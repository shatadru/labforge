name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  IMAGE_NAME: ${{ github.repository }}
  # Resolved once per job via scripts/version.sh (tag -> X.Y.Z, branch -> X.Y.Z-ci.<sha>).

# Path → job map (also in docs/development.md):
#   docs (*.md, docs/**, LICENSE)     → Docs
#   backend/**                        → Test, Agent smoke, Build image, Packages
#   charts/**, k8s/**                 → Helm lint, Helm kind
#   deploy/**, scripts/**, Makefile, VERSION → Packages, systemd
#   .github/workflows/**              → all jobs (workflow edits must re-verify CI)
# Releases are published by .github/workflows/release.yml on a GitHub Release.

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
      backend: ${{ steps.filter.outputs.backend }}
      chart: ${{ steps.filter.outputs.chart }}
      deploy: ${{ steps.filter.outputs.deploy }}
      workflow: ${{ steps.filter.outputs.workflow }}
      full: ${{ steps.full.outputs.full }}
    steps:
      - uses: actions/checkout@v4
      - name: Tag or full run?
        id: full
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "full=true" >> "$GITHUB_OUTPUT"
          else
            echo "full=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            docs:
              - '**/*.md'
              - 'docs/**'
              - 'LICENSE'
            backend:
              - 'backend/**'
            chart:
              - 'charts/**'
              - 'k8s/**'
            deploy:
              - 'deploy/**'
              - 'scripts/**'
              - 'Makefile'
              - 'VERSION'
            workflow:
              - '.github/workflows/**'

  docs:
    name: Docs
    needs: [changes]
    if: >
      needs.changes.outputs.full == 'true' ||
      needs.changes.outputs.docs == 'true' ||
      needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docs sanity
        run: |
          set -euo pipefail
          test -f README.md
          test -f docs/README.md
          if grep -RIn $'\u2014' README.md docs/ 2>/dev/null; then
            echo "em dash (U+2014) found in docs; use ASCII instead" >&2
            exit 1
          fi
          echo "docs ok"

  test:
    name: Test
    needs: [changes]
    if: >
      needs.changes.outputs.full == 'true' ||
      needs.changes.outputs.backend == 'true' ||
      needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install deps
        run: pip install -r backend/requirements-dev.txt

      - name: Run tests
        working-directory: backend
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=80

      - name: Compile check
        working-directory: backend
        run: python -m compileall -q app

  agent-smoke:
    name: Agent smoke test
    needs: [changes]
    if: >
      needs.changes.outputs.full == 'true' ||
      needs.changes.outputs.backend == 'true' ||
      needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install deps
        run: pip install -r backend/requirements.txt

      - name: Start the agent and check auth
        working-directory: backend
        env:
          MODE: agent
          AGENT_TOKEN: testtoken
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8443 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8443/agent/v1/health && break
            sleep 0.5
          done
          code() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
          test "$(code http://127.0.0.1:8443/agent/v1/health)" = "200"
          test "$(code http://127.0.0.1:8443/agent/v1/info)" = "401"
          test "$(code -H 'Authorization: Bearer testtoken' \
                  http://127.0.0.1:8443/agent/v1/info)" = "200"

  package:
    name: Build agent packages
    needs: [changes]
    if: >
      needs.changes.outputs.full == 'true' ||
      needs.changes.outputs.backend == 'true' ||
      needs.changes.outputs.deploy == 'true' ||
      needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: echo "version=$(./scripts/version.sh)" >> "$GITHUB_OUTPUT"

      - name: Install nfpm and rpm tooling
        run: |
          sudo apt-get update && sudo apt-get install -y rpm
          curl -sSfL https://github.com/goreleaser/nfpm/releases/download/v2.35.1/nfpm_2.35.1_Linux_x86_64.tar.gz \
            | sudo tar -xz -C /usr/local/bin nfpm

      - name: Build .deb and .rpm
        run: VERSION="${{ steps.version.outputs.version }}" make package

      - name: Verify package contents
        run: |
          set -e
          ls -l dist/*.deb dist/*.rpm
          test -s "$(ls dist/*.deb | head -1)"
          test -s "$(ls dist/*.rpm | head -1)"
          dpkg-deb -c dist/*.deb | grep -q 'usr/lib/labforge/app/main.py'
          dpkg-deb -c dist/*.deb | grep -q 'usr/lib/labforge/VERSION'
          rpm -qpl dist/*.rpm | grep -q 'usr/lib/labforge/app/main.py'
          rpm -qpl dist/*.rpm | grep -q 'labforge-agent.service'

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: labforge-agent-packages
          path: |
            dist/*.deb
            dist/*.rpm

  package-install:
    name: Install package on ${{ matrix.distro }}
    needs: [changes, package]
    if: >
      always() &&
      (needs.changes.outputs.full == 'true' ||
       needs.changes.outputs.backend == 'true' ||
       needs.changes.outputs.deploy == 'true' ||
       needs.changes.outputs.workflow == 'true') &&
      needs.package.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: debian:12
            kind: deb
          - distro: fedora:40
            kind: rpm
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: labforge-agent-packages
          path: dist

      - name: Install and verify the package
        run: |
          set -eux
          ls -l dist
          if [ "${{ matrix.kind }}" = "deb" ]; then
            docker run --rm -v "$PWD/dist:/dist:ro" "${{ matrix.distro }}" bash -euxc '
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends /dist/*.deb
              test -f /usr/lib/labforge/app/main.py
              test -f /usr/lib/labforge/VERSION
              test -x /usr/lib/labforge/venv/bin/uvicorn
              test -f /usr/lib/systemd/system/labforge-agent.service
              dpkg -s labforge-agent | grep -q "Status: install ok installed"
              id labforge
            '
          else
            docker run --rm -v "$PWD/dist:/dist:ro" "${{ matrix.distro }}" bash -euxc '
              dnf install -y /dist/*.rpm
              test -f /usr/lib/labforge/app/main.py
              test -f /usr/lib/labforge/VERSION
              test -x /usr/lib/labforge/venv/bin/uvicorn
              test -f /usr/lib/systemd/system/labforge-agent.service
              rpm -q labforge-agent
              id labforge
            '
          fi

  helm:
    name: Lint and package Helm chart
    needs: [changes]
    if: >
      needs.changes.outputs.full == 'true' ||
      needs.changes.outputs.chart == 'true' ||
      needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Resolve version
        id: version
        run: echo "version=$(./scripts/version.sh)" >> "$GITHUB_OUTPUT"

      - name: Resolve chart dependencies
        run: |
          if grep -q '^dependencies:' charts/labforge/Chart.yaml; then
            helm dependency build charts/labforge
          fi

      - name: Lint chart
        run: >
          helm lint charts/labforge
          --set agent.url=http://127.0.0.1:8443

      - name: Package chart
        run: |
          mkdir -p dist
          helm package charts/labforge --destination dist \
            --version "${{ steps.version.outputs.version }}" \
            --app-version "${{ steps.version.outputs.version }}"

      - name: Verify chart contents
        run: |
          set -e
          ls -l dist/*.tgz
          tar -tzf dist/*.tgz | grep -q 'labforge/Chart.yaml'
          tar -tzf dist/*.tgz | grep -q 'labforge/templates/deployment.yaml'

      - name: Upload chart artifact
        uses: actions/upload-artifact@v4
        with:
          name: helm-chart
          path: dist/*.tgz

  helm-kind:
    name: Helm chart install test (kind)
    needs: [changes]
    if: >
      needs.changes.outputs.full == 'true' ||
      needs.changes.outputs.chart == 'true' ||
      needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Install kind and kubectl
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfLo "$HOME/.local/bin/kind" \
            https://kind.sigs.k8s.io/dl/v0.25.0/kind-linux-amd64
          curl -sSfLo "$HOME/.local/bin/kubectl" \
            https://dl.k8s.io/release/v1.31.4/bin/linux/amd64/kubectl
          chmod +x "$HOME/.local/bin/kind" "$HOME/.local/bin/kubectl"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Create kind cluster
        run: kind create cluster --name labforge-ci --wait 120s

      - name: Resolve chart dependencies
        run: |
          if grep -q '^dependencies:' charts/labforge/Chart.yaml; then
            helm dependency build charts/labforge
          fi

      - name: Lint the chart
        run: >
          helm lint charts/labforge
          --set agent.url=http://127.0.0.1:8443

      - name: Server-side validate the chart and kustomize overlays
        run: |
          set -e
          kubectl create namespace labforge
          helm template labforge charts/labforge --namespace labforge \
            --set agent.url=http://127.0.0.1:8443 > /tmp/chart.yaml
          kubectl apply --dry-run=server -n labforge -f /tmp/chart.yaml
          kubectl apply --dry-run=server -k k8s/base
          kubectl apply --dry-run=server -k k8s/overlays/dev
          kubectl apply --dry-run=server -k k8s/overlays/prod

      - name: Install the chart and check resources
        run: |
          set -e
          kubectl create secret generic labforge-ssh-keys \
            --namespace labforge --from-literal=authorized_keys="ssh-ed25519 AAAA ci@ci"
          kubectl create secret generic labforge-agent-token \
            --namespace labforge --from-literal=token="ci-agent-token-not-a-placeholder"
          helm install labforge charts/labforge \
            --namespace labforge \
            --set image.repository=nginx --set image.tag=1.27-alpine \
            --set agent.url=http://127.0.0.1:8443
          kubectl get deploy,svc,configmap,serviceaccount -n labforge
          DEPLOY=$(kubectl get deploy -n labforge \
            -l app.kubernetes.io/instance=labforge \
            -o jsonpath='{.items[0].metadata.name}')
          test -n "$DEPLOY"
          test "$(kubectl get deploy "$DEPLOY" -n labforge \
            -o jsonpath='{.spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem}')" = "true"
          test "$(kubectl get deploy "$DEPLOY" -n labforge \
            -o jsonpath='{.spec.template.spec.securityContext.runAsNonRoot}')" = "true"
          test "$(kubectl get cm -n labforge \
            -l app.kubernetes.io/instance=labforge \
            -o jsonpath='{.items[0].data.HOST_MODE}')" = "remote"
          test "$(kubectl get deploy "$DEPLOY" -n labforge \
            -o jsonpath='{.spec.template.spec.hostNetwork}')" != "true"
          helm uninstall labforge --namespace labforge

      - name: Dump cluster state on failure
        if: failure()
        run: |
          kubectl get all -A || true
          kubectl describe nodes || true

  systemd:
    name: Validate systemd units
    needs: [changes]
    if: >
      needs.changes.outputs.full == 'true' ||
      needs.changes.outputs.deploy == 'true' ||
      needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: systemd-analyze verify
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y systemd
          CTRL_ROOT=/tmp/labforge-ci/control
          AGENT_ROOT=/tmp/labforge-ci/agent
          mkdir -p "$CTRL_ROOT/backend/.venv/bin" "$AGENT_ROOT/venv/bin"
           touch "$CTRL_ROOT/backend/.venv/bin/uvicorn" "$AGENT_ROOT/venv/bin/uvicorn" \
             "$AGENT_ROOT/venv/bin/python"
           chmod +x "$CTRL_ROOT/backend/.venv/bin/uvicorn" \
             "$AGENT_ROOT/venv/bin/uvicorn" "$AGENT_ROOT/venv/bin/python"

          sed -e "s|__BACKEND__|$CTRL_ROOT/backend|g" \
              -e "s|__VENV__|$CTRL_ROOT/backend/.venv|g" \
              deploy/labforge.service > /tmp/labforge.service
          sed -e "s|/usr/lib/labforge|$AGENT_ROOT|g" \
              deploy/labforge-agent.service > /tmp/labforge-agent.service

          fail=0
          for unit in /tmp/labforge.service /tmp/labforge-agent.service; do
            echo "== $unit"
            out=$(systemd-analyze verify --man=no "$unit" 2>&1 || true)
            if [ -n "$out" ]; then
              echo "$out"
              echo "systemd-analyze verify reported errors for $unit" >&2
              fail=1
            else
              echo "ok (no output)"
            fi
          done

          sed 's|WorkingDirectory=.*|WorkingDirectory=relative-path|' \
            /tmp/labforge-agent.service > /tmp/labforge-agent-bad.service
          bad=$(systemd-analyze verify --man=no /tmp/labforge-agent-bad.service 2>&1 || true)
          if [ -z "$bad" ]; then
            echo "expected verify to flag a relative WorkingDirectory" >&2
            fail=1
          else
            echo "canary ok: verify rejected relative WorkingDirectory"
          fi

          exit "$fail"

  build:
    name: Build and push image
    needs: [changes, test, agent-smoke]
    if: >
      always() &&
      (needs.changes.outputs.full == 'true' ||
       needs.changes.outputs.backend == 'true' ||
       needs.changes.outputs.workflow == 'true') &&
      needs.test.result == 'success' &&
      needs.agent-smoke.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: echo "version=$(./scripts/version.sh)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=pr,enable=${{ github.event_name == 'pull_request' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: backend
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: |
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan (PR builds)
        if: github.event_name == 'pull_request'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ env.IMAGE_NAME }}:pr
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
