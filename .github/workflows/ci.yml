name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]

env:
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install deps
        run: pip install -r backend/requirements-dev.txt

      - name: Run tests
        working-directory: backend
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=80

      - name: Compile check
        working-directory: backend
        run: python -m compileall -q app

  agent-smoke:
    name: Agent smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install deps
        run: pip install -r backend/requirements.txt

      - name: Start the agent and check auth
        working-directory: backend
        env:
          MODE: agent
          AGENT_TOKEN: testtoken
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8443 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8443/agent/v1/health && break
            sleep 0.5
          done
          code() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
          test "$(code http://127.0.0.1:8443/agent/v1/health)" = "200"
          test "$(code http://127.0.0.1:8443/agent/v1/info)" = "401"
          test "$(code -H 'Authorization: Bearer testtoken' \
                  http://127.0.0.1:8443/agent/v1/info)" = "200"

  package:
    name: Build agent packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install nfpm and rpm tooling
        run: |
          sudo apt-get update && sudo apt-get install -y rpm
          curl -sSfL https://github.com/goreleaser/nfpm/releases/download/v2.35.1/nfpm_2.35.1_Linux_x86_64.tar.gz \
            | sudo tar -xz -C /usr/local/bin nfpm

      - name: Build .deb and .rpm
        run: VERSION=0.1.0-ci make package

      - name: Verify package contents
        run: |
          set -e
          ls -l dist/*.deb dist/*.rpm
          test -s "$(ls dist/*.deb | head -1)"
          test -s "$(ls dist/*.rpm | head -1)"
          dpkg-deb -c dist/*.deb | grep -q 'usr/lib/labforge/app/main.py'
          rpm -qpl dist/*.rpm | grep -q 'usr/lib/labforge/app/main.py'
          rpm -qpl dist/*.rpm | grep -q 'labforge-agent.service'

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: labforge-agent-packages
          path: |
            dist/*.deb
            dist/*.rpm

  helm:
    name: Build and lint Helm chart
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        uses: helm/helm-action@v3
        with:
          version: v3.14.0

      - name: Lint chart
        run: |
          helm lint charts/labforge

      - name: Package chart
        run: |
          helm package charts/labforge --destination dist

      - name: Verify chart contents
        run: |
          test -f dist/labforge-0.1.0.tgz
          tar -tzf dist/labforge-0.1.0.tgz | grep -q 'Chart.yaml'

      - name: Upload chart artifact
        uses: actions/upload-artifact@v4
        with:
          name: helm-chart
          path: dist/*

  systemd:
    name: Validate systemd units
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: systemd-analyze verify
        run: |
          sudo apt-get update && sudo apt-get install -y systemd
          for unit in deploy/*.service; do
            echo "== $unit"
            systemd-analyze verify "$unit" || true
          done

  build:
    name: Build and push image
    runs-on: ubuntu-latest
    needs: [test, agent-smoke]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: |
            ${{ steps.meta.outputs.tags }}
            labforge:pr
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan (PR builds)
        if: github.event_name == 'pull_request'
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: labforge:pr
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
