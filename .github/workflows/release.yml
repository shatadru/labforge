name: Release

# Two ways in:
#   release: published        -> the publisher. Runs when you publish a release
#                                (created by hand in the UI or by `prepare`).
#   workflow_dispatch (bump)  -> the preparer. Bumps the version with
#                                bump-my-version, pushes to main, and opens a
#                                DRAFT release. You review and click Publish.
#
# Publishing fans one tag out to every artifact:
#   image, .deb, .rpm, chart .tgz, and the chart on GHCR (OCI).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      bump:
        description: "Semver bump"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  packages: write

env:
  IMAGE_NAME: ${{ github.repository }}
  CHART_OCI: oci://ghcr.io/${{ github.repository_owner }}/charts

jobs:
  prepare:
    name: Prepare draft release
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bump-my-version
        run: pip install bump-my-version

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        id: bump
        run: |
          set -euo pipefail
          bump-my-version bump ${{ inputs.bump }} --commit --no-tag
          version="$(tr -d '[:space:]' < VERSION)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Push bump commit
        run: git push origin HEAD:main

      - name: Open draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.bump.outputs.version }}" \
            --draft \
            --generate-notes \
            --target main \
            --title "LabForge v${{ steps.bump.outputs.version }}"

  publish:
    name: Publish release artifacts
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Resolve and verify version
        id: version
        run: |
          set -euo pipefail
          tag="${{ github.event.release.tag_name }}"
          version="${tag#v}"
          file="$(tr -d '[:space:]' < VERSION)"
          chart="$(awk '/^version:/{print $2; exit}' charts/labforge/Chart.yaml)"
          app="$(awk -F'"' '/^appVersion:/{print $2; exit}' charts/labforge/Chart.yaml)"
          echo "tag=${tag} version=${version} VERSION=${file} chart=${chart} appVersion=${app}"
          if [ "${version}" != "${file}" ]; then
            echo "::error::release tag ${tag} != VERSION ${file}; run make release-... first"
            exit 1
          fi
          if [ "${version}" != "${chart}" ] || [ "${version}" != "${app}" ]; then
            echo "::error::release tag ${tag} != Chart.yaml version/appVersion (${chart}/${app})"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -euo pipefail
          img="ghcr.io/${IMAGE_NAME}"
          tags="${img}:${VERSION},${img}:${VERSION%.*}"
          if [ "${PRERELEASE}" != "true" ]; then
            tags="${tags},${img}:latest"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: backend
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install packaging tools
        run: |
          sudo apt-get update && sudo apt-get install -y rpm
          curl -sSfL https://github.com/goreleaser/nfpm/releases/download/v2.35.1/nfpm_2.35.1_Linux_x86_64.tar.gz \
            | sudo tar -xz -C /usr/local/bin nfpm

      - name: Build .deb and .rpm
        run: VERSION="${{ steps.version.outputs.version }}" make package

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Package Helm chart
        run: |
          set -euo pipefail
          if grep -q '^dependencies:' charts/labforge/Chart.yaml; then
            helm dependency build charts/labforge
          fi
          mkdir -p dist
          helm package charts/labforge --destination dist \
            --version "${{ steps.version.outputs.version }}" \
            --app-version "${{ steps.version.outputs.version }}"

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            dist/*.deb dist/*.rpm dist/*.tgz --clobber

      - name: Push chart to GHCR (OCI)
        run: |
          helm registry login ghcr.io -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}"
          helm push "dist/labforge-${{ steps.version.outputs.version }}.tgz" "${CHART_OCI}"
