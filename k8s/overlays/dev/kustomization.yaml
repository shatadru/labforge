apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target:
      kind: Deployment
      name: labforge
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: ghcr.io/OWNER/labforge:0.1.0
  - target:
      kind: ConfigMap
      name: labforge-config
    patch: |-
      - op: replace
        path: /data/LOG_LEVEL
        value: debug