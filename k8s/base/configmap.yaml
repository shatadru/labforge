apiVersion: v1
kind: ConfigMap
metadata:
  name: labforge-config
  namespace: labforge
  labels:
    app.kubernetes.io/name: labforge
data:
  MODE: "control"
  HOST_MODE: "remote"
  AGENT_URL: "http://kvm-host:8443"
  VM_NAME_PREFIX: "labs-"
  DEFAULT_MEMORY_MB: "1536"
  DEFAULT_VCPUS: "2"
  DEFAULT_DISK_GB: "30"
  RESOURCE_BUDGET_PERCENT: "50"
  GRAPHICS_TYPE: "vnc"
  LOG_LEVEL: "info"
