apiVersion: apps/v1
kind: Deployment
metadata:
  name: labforge
  namespace: labforge
  labels:
    app.kubernetes.io/name: labforge
    app.kubernetes.io/part-of: labforge
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: labforge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: labforge
        app.kubernetes.io/part-of: labforge
    spec:
      serviceAccountName: labforge
      automountServiceAccountToken: false
      # Control plane only. Pin to any node; libvirt is on labforge-agent.
      # nodeSelector:
      #   kubernetes.io/hostname: control-node
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: labforge
          # Pin an immutable tag (Renovate bumps it); never use :latest.
          image: ghcr.io/OWNER/labforge:0.1.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: labforge-config
          env:
            - name: SSH_PUBLIC_KEYS_FILE
              value: /etc/labforge/ssh/authorized_keys
            - name: AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: labforge-agent-token
                  key: token
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          volumeMounts:
            - name: ssh-keys
              mountPath: /etc/labforge/ssh
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        #   kubectl -n labforge create secret generic labforge-ssh-keys \
        #     --from-file=authorized_keys=$HOME/.ssh/id_ed25519.pub
        - name: ssh-keys
          secret:
            secretName: labforge-ssh-keys
        - name: tmp
          emptyDir: {}
